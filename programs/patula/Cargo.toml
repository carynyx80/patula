[package]
name = "patula"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "patula"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "launchpad/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
bytemuck = { version = "1.25", features = ["derive", "min_const_generics"] }
anchor-lang = { version = "0.32.2", features = ["init-if-needed"] }
anchor-spl = { version = "0.32.1", features = ["token", "associated_token"] }
launchpad = { path = "../launchpad", features = ["cpi"] }
groth16-solana = "0.3.1"
solana-poseidon = "5.0.1"
solana-sha256-hasher = "2.3.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
